<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mailing List Signup</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .card {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        width: min(100%, 420px);
      }

      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      input {
        padding: 0.8rem;
        border: 1px solid #ccd4e0;
        border-radius: 8px;
        font-size: 1rem;
      }

      button {
        padding: 0.8rem;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }

      .message {
        margin-top: 0.75rem;
        color: #15803d;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Join the mailing list</h1>
      <p>Enter your email to receive updates.</p>
      <form action="/subscribe" method="POST">
        <input type="email" name="email" placeholder="you@example.com" required />
        <button type="submit">Subscribe</button>
      </form>
      <div class="message" id="status"></div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.get('success') === '1') {
        document.getElementById('status').textContent = 'Thanks for subscribing!';
      }
    </script>
  </body>
</html>
